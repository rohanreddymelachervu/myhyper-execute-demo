---
version: 0.1
# globalTimeout: 70
# testSuiteTimeout: 70
testSuiteStep: 700000
differentialUpload:
  enabled: true
  ttlHours: 60
runson: ${matrix.os}
# runson: win
matrix:
  os: ["win"]
  browser: ["chrome"]

parallelism: 1

# concurrency: 1

# env:
#   UserLevel: ${{ .secrets.UserLevel }}
#   ProjectLevel: ${{ .secrets.ProjectLevel }}
#   OrgLevel: ${{ .secrets.OrgLevel }}
 
# project:
#   name: rishabh-arya95/testng-selenium-hyperexecute-sample

autosplit: true
retryOnFailure: true
maxRetries: 1
# concurrency: 2
# combineTasksInMatrixMode: true

# env:
#   TESTING_DELETE_LATER: ${{ secrets.rohan-dev-testing }}
 

cacheKey: '{{ checksum "requirements.txt" }}'
cacheDirectories:
  - CacheDir
pre:
  - pip3 install -r requirements.txt --cache-dir CacheDir


post:
  - cat yaml/win/pyunit_hyperexecute_autosplit_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: TestReport
    path:
     - example_report/**/*
     
report: true
partialReports:
    type: json
    location: /
    frameworkName: extent
project:
#   id: 01JSYB97FCNRNEED6SQ3NCNV26
  # id: 01JT0SYC80XRB5CTZVRHTMJ7NB
  id: 01JT1BFQPKD50KQ0EKPVC1K6NM

testDiscovery:
  type: raw
  mode: dynamic
  command: grep -nri 'HyperTestPyUnit' tests -ir --include=\*.py | sed 's/:.*//'

testRunnerCommand: python3 $test --OS ${matrix.os} --browser ${matrix.browser}

jobLabel: [selenium-pyunit, autosplit]